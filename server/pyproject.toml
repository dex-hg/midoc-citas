[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "midoc-servidor"
version = "0.1.0"
description = "Servidor de MiDoc con Flask y configuración para Supabase"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Flask==3.1.3",
    "python-dotenv==1.2.4",
    "supabase==2.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools]
py-modules = ["wsgi"]

[tool.setuptools.packages.find]
include = ["midoc*"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["prueba_*.py"]
python_functions = ["prueba_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
